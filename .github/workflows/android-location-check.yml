name: Android location and map UI check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-location-check.yml
      - android/app/src/androidTest/java/dev/giljabi/LocationSmokeTest.java
      - android/app/src/androidTest/java/dev/giljabi/LocationUiSmokeTest.java
      - android/scripts/location_system_smoke.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  system-location:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm location code matches the published 0.9.3 app
        run: |
          git fetch --depth=1 origin tag android-v0.9.3-full
          git diff --exit-code android-v0.9.3-full -- android/app/src/main android/app/build.gradle.kts
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GPS API, app button, displayed position and map refresh
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -no-metrics -gpu swiftshader_indirect
          working-directory: android
          script: bash scripts/location_system_smoke.sh
      - name: Publish successful GPS UI evidence alongside 0.9.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          file=Path('android/location-system-validation/location-system-check.json')
          result=json.loads(file.read_text())
          result['ci_run']=os.environ['GITHUB_RUN_ID']
          result['test_source']=os.environ['GITHUB_SHA']
          result['production_matches_release']='android-v0.9.3-full'
          result['test_build']='x86_64 lite; same Java app source, no bundled models'
          file.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          gh release upload android-v0.9.3-full android/location-system-validation/location-system-check.json android/location-system-validation/location-system-screen.png --clobber
      - name: Upload location test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-location-system-check
          path: |
            android/location-system-validation/
            android/location-system-smoke.log
            android/app/build/outputs/androidTest-results/
          retention-days: 14
