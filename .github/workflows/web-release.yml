name: Website checks and Cloudflare upload files
on:
  push:
    tags: ['web-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install fastapi==0.135.2 httpx==0.28.1 python-dotenv==1.2.2 pillow==11.3.0 pytest==9.0.2
      - run: npm test
      - run: npm run package:site
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: giljabi-cloudflare-website
          path: release-web/*
          compression-level: 0
          retention-days: 7
      - name: Publish website ZIPs
        if: startsWith(github.ref, 'refs/tags/web-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-web/* --prerelease --title '길잡이 웹 · Cloudflare Pages 업로드 파일' --notes-file WEB_RELEASE_NOTES.md
