name: Android full offline APK
on:
  push:
    tags:
      - 'android-v*-full'
    branches:
      - main
    paths:
      - android/FULL_RELEASE_NOTES.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-apk:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse the test app signing key across full CI builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: giljabi-full-debug-signing-v1
      - name: Install Android toolchain
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          manager = Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/sdkmanager'
          if not manager.is_file():
              raise SystemExit('::error::Hosted Android SDK manager is missing')
          subprocess.run([str(manager), '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([str(manager), 'platforms;android-35', 'build-tools;35.0.0', 'ndk;27.0.12077973', 'cmake;3.22.1'], check=True)
          PY
      - name: Prepare verified native engine
        run: python3 android/scripts/prepare_engine.py
      - name: Prepare pinned model and vision assets
        run: |
          python3 android/scripts/prepare_bundled_models.py --cache "$RUNNER_TEMP/model-cache" --output android/model-packs/minicpm-1b
          rm -rf -- "${RUNNER_TEMP:?}/model-cache"
      - name: Reproduce template failure and verify native fix
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S android/native-tests -B "$RUNNER_TEMP/giljabi-native-check" -G 'Unix Makefiles'
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build "$RUNNER_TEMP/giljabi-native-check" --target template_regression giljabi_guard_probe -j4
          "$RUNNER_TEMP/giljabi-native-check/bin/template_regression" android/model-packs/minicpm-1b/model.gguf
          java -Djava.library.path="$RUNNER_TEMP/giljabi-native-check/bin" android/native-tests/NativeGuardProbe.java
          python3 - <<'PY'
          from pathlib import Path
          Path('native-validation.json').write_text('{"template_failure_reproduced":true,"complete_turn_rendering_passed":true,"jni_exception_guard_passed":true}\n')
          PY
      - name: Build and verify full APK
        working-directory: android
        run: ./gradlew --no-daemon -PbundledModelDir=../model-packs/minicpm-1b :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Summarize tests and lint
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          report = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in report:
                  report[key] += int(root.get(key, 0))
              for case in root.findall('testcase'):
                  problem = case.find('failure')
                  if problem is None:
                      problem = case.find('error')
                  if problem is not None:
                      message = (problem.get('message', '') + ' ' + (problem.text or ''))[:1000].replace('%','%25').replace('\n','%0A').replace('\r','%0D')
                      print('::error title=' + case.get('classname', '') + '.' + case.get('name', '') + '::' + message)
          lint = Path('android/app/build/reports/lint-results-debug.xml')
          if lint.exists():
              report['lint_errors'] = sum(i.get('severity') in ('Error','Fatal') for i in ET.parse(lint).getroot())
          Path('build-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - name: Prepare downloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          metadata=json.loads(Path('android/app/build/outputs/apk/debug/output-metadata.json').read_text())
          version=metadata['elements'][0]['versionName']
          if not version.endswith('-full'):
              raise SystemExit('Refusing to publish a lite build as the bundled app')
          folder=Path('release-apk');folder.mkdir(exist_ok=True)
          shutil.copyfile('build-validation.json',folder/'checks.json')
          shutil.copyfile('native-validation.json',folder/'native-checks.json')
          name='giljabi-'+version+'-debug.apk';target=folder/name
          shutil.copyfile('android/app/build/outputs/apk/debug/app-debug.apk',target)
          with target.open('rb') as stream:
              sha=hashlib.file_digest(stream,'sha256').hexdigest()
          (folder/(name+'.sha256')).write_text(sha+'  '+name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: giljabi-full-debug
          path: release-apk/*
          compression-level: 0
          retention-days: 1
      - name: Publish tagged test release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-apk/* --prerelease --title '길잡이 · ESP 영상 안정화 / 자동 AI' --notes-file android/FULL_RELEASE_NOTES.md
  release-notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Find release tag for the documented app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          source=Path('android/app/build.gradle.kts').read_text()
          line=next(line for line in source.splitlines() if 'versionName =' in line)
          version=re.search(r'"([0-9]+\.[0-9]+\.[0-9]+)-full"',line).group(1)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('GILJABI_NOTES_TAG=android-v'+version+'-full\n')
          PY
      - name: Update published installation notes without rebuilding the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GILJABI_NOTES_TAG" >/dev/null 2>&1; then
            gh release edit "$GILJABI_NOTES_TAG" --notes-file android/FULL_RELEASE_NOTES.md
          else
            echo 'No published release yet; notes will be included when the release is created.'
          fi
