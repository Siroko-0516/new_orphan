name: Android system phone check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-phone-check.yml
      - android/app/src/androidTest/java/dev/giljabi/PhoneSystemSmokeTest.java
      - android/app/src/androidTest/java/dev/giljabi/SystemEvidence.java
      - android/scripts/phone_system_smoke.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  system-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm production code matches the published 0.9.4 app
        run: |
          git fetch --depth=1 origin tag android-v0.9.4-full
          git diff --exit-code android-v0.9.4-full -- android/app/src/main android/app/build.gradle.kts
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android contacts, Telecom and dialer UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          avd-name: giljabi-phone
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -read-only -no-metrics -gpu swiftshader_indirect -memory 2560
          working-directory: android
          script: bash scripts/phone_system_smoke.sh
      - name: Export the successful system test before report formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/phone-system-validation/phone-system-check.json android/phone-system-validation/phone-system-raw-check.json
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('android/app/build/outputs/androidTest-results')
          with zipfile.ZipFile('android/phone-system-validation/phone-system-instrumentation.zip','w',zipfile.ZIP_DEFLATED) as output:
              for file in root.rglob('TEST-*.xml'): output.write(file,file.relative_to(root))
          PY
          gh release upload android-v0.9.4-full android/phone-system-validation/phone-system-raw-check.json android/phone-system-validation/phone-system-screen.png android/phone-system-validation/phone-system-instrumentation.zip --clobber
      - name: Summarize the actual system call test
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,re,sys,traceback,xml.etree.ElementTree as E
          from pathlib import Path
          def exception(kind,error,trace):
              message=''.join(traceback.format_exception(kind,error,trace))[-3500:]
              print('::error title=Phone evidence summary::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          sys.excepthook=exception
          totals={k:0 for k in ['tests','failures','errors','skipped']}
          for file in Path('android/app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              root=E.parse(file).getroot()
              for key in totals: totals[key]+=int(root.get(key,0))
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      message=(case.get('name','')+': '+(failure.text or failure.get('message','')))[:3500]
                      print('::error::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          report=Path('android/phone-system-validation/phone-system-check.json')
          if report.exists():
              result=json.loads(report.read_text())
              result.update(totals)
              result['ci_run']=os.environ['GITHUB_RUN_ID']
              result['test_source']=os.environ['GITHUB_SHA']
              result['production_matches_release']='android-v0.9.4-full'
              result['test_build']='x86_64 lite; same Java app source, no bundled models'
              peer=Path('android/phone-system-validation/peer-gsm-check.txt')
              peer_state=peer.read_text() if peer.exists() else ''
              result['virtual_peer_received_call']=bool(re.search('inbound|incoming|(?:mState|state)\\s*[:=]\\s*RINGING\\b',peer_state,re.I))
              result['virtual_peer_state']=peer_state[:1000]
              report.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
              if not result['virtual_peer_received_call']:
                  print('App outgoing call and dialer test passed. Peer modem delivery was not confirmed; the report explicitly records false.')
          print(json.dumps(totals))
          if totals!={'tests':1,'failures':0,'errors':0,'skipped':0}:
              for name in ['android/phone-system-validation/peer-emulator.log','android/phone-system-smoke.log']:
                  file=Path(name)
                  if file.exists():
                      message='\n'.join(file.read_text(errors='replace').splitlines()[-45:])[-6000:]
                      for start in range(0,len(message),3000):
                          part=message[start:start+3000]
                          print('::error title='+file.name+'::'+part.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              raise SystemExit('Phone system test did not pass exactly once')
          PY
      - name: Upload the test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-android-phone-check
          path: |
            android/phone-system-validation/
            android/phone-system-smoke.log
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Publish successful emulator evidence alongside 0.9.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload android-v0.9.4-full android/phone-system-validation/phone-system-check.json android/phone-system-validation/phone-system-screen.png --clobber
