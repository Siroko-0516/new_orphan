<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>길잡이</title><link rel="stylesheet" href="/static/compact.css"></head>
<body><main>
<header><strong>길잡이</strong><button id="choose-model">모델 변경 · <span id="selected-model">물체 감지만</span></button></header>
<div class="layout"><section class="camera-panel"><div class="panel-top"><span>카메라</span><span id="camera-state">대기</span></div><div class="viewport"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="placeholder">카메라를 시작하세요</div></div>
<div class="controls"><button id="start" class="primary">시작</button><button id="stop" disabled>중지</button><label><input id="voice" type="checkbox" checked> 음성</label></div></section>
<section class="results"><p id="local-alert" role="status" hidden></p><div id="risk" class="risk unknown"><span id="risk-icon">◌</span> <strong id="risk-title">대기</strong></div><p id="guidance" aria-live="polite">모델을 선택하고 시작하세요.</p><small id="updated"></small><div class="object-title">감지 <span id="count">0개</span></div><div id="objects"></div></section></div>
<p id="notice" role="status" hidden></p>
<details><summary>음성 설정 · 상태</summary><div class="controls"><button id="test-native">기본 음성 테스트</button><button id="test-speech">음성 테스트</button></div><p id="tts-feedback" role="status"></p><p><span id="tts-mode">기본 TTS</span> · <span id="tts-led">대기</span></p><p>감지 <span id="yolo-led">대기</span> · 분석 <span id="ai-led">꺼짐</span> · <span id="provider">연결 확인 중</span></p></details>
<small class="privacy">감지는 기기에서 처리합니다. 온라인 모델 선택 시 일부 사진이 AI 제공자에게 전송됩니다. 보조 안내용입니다.</small>
<input id="ai-optin" type="checkbox" hidden disabled>
<dialog id="model-dialog"><form method="dialog"><div class="dialog-head"><strong>모델 선택</strong><button aria-label="닫기">닫기</button></div></form><div class="choices"><button data-provider="none">물체 감지만 <small>YOLO · 기기 내 실행</small></button><button data-provider="gemini" disabled>Gemini <small id="gemini-state">서버 설정 확인 중</small></button><button data-provider="openai" disabled>GPT <small id="openai-state">서버 설정 확인 중</small></button><button disabled>MiniCPM 4.7 <small>현재 미연결 · 준비 중</small></button></div></dialog>
</main><script type="module" src="/static/app.js"></script></body></html>
